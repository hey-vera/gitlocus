# SPDX-License-Identifier: Apache-2.0
#
# cargo-deny configuration. Checked in CI on every pull request and daily, since
# advisories land continuously and a clean run last week means very little.

[graph]
all-features = true

[advisories]
# Any known vulnerability fails the build. There is no severity threshold: a
# project about trustworthy dependencies does not get to carry known-vulnerable
# ones because they scored low.
yanked = "deny"
ignore = []

[licenses]
# Apache-2.0 throughout, and dependencies must be compatible with redistribution
# under it. Strong copyleft is denied by omission rather than by a deny list, so
# a new licence appearing in the tree fails loudly instead of slipping through.
confidence-threshold = 0.93
# Exactly the licences present in the current tree, and no more. A dependency
# arriving under a licence not listed here fails the build on purpose: adding one
# should be a decision someone makes, not a default someone inherits.
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# AGPL-3.0 is deliberately NOT in the list above. It is the licence of this
# project's own server crate (ADR 0016), and allowing it globally would let an
# AGPL *dependency* into the tree unnoticed — which for the Apache-2.0 kernel
# would be a licence violation rather than a preference. Scoping it to the one
# crate that is meant to carry it keeps the map enforced rather than declared.
exceptions = [
    { name = "locusd", allow = ["AGPL-3.0-only"] },
    { name = "locus-ledger", allow = ["AGPL-3.0-only"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A build script is arbitrary code executed at compile time on every machine
# that builds this project, including contributors' laptops. Not banned — much
# of the ecosystem needs them — but they are the highest-value place to look
# when reviewing a dependency addition.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
