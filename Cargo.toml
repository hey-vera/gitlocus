[workspace]
resolver = "3"
members = ["crates/locus-core", "crates/locus-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/hey-vera/gitlocus"
homepage = "https://github.com/hey-vera/gitlocus"
authors = ["The GitLocus Authors"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
jsonschema = { version = "0.49", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic wants every product name in backticks. Rendering "GitLocus" as code
# in prose is worse documentation, not better.
doc_markdown = "allow"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
