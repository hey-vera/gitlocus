[workspace]
resolver = "3"
members = ["crates/gitlocus-core", "crates/gitlocus-cli", "crates/locusd", "crates/locus-ledger", "crates/repo-conformance"]

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/hey-vera/gitlocus"
homepage = "https://locus.heyvera.org"
authors = ["The GitLocus Authors"]

[workspace.dependencies]
# The one crate in this workspace that another depends on. Its version is pinned
# rather than left to the path, so a published gitlocus-cli cannot resolve to a
# core it was never built against.
gitlocus-core = { path = "crates/gitlocus-core", version = "0.0.4" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
jsonschema = { version = "0.49", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
# A five-crate dependency tree, all MIT OR Apache-2.0. A framework with an async
# runtime is the obvious alternative and is not obviously better on two cores
# with a strict licence allow-list; revisit when there is traffic to justify it.
tiny_http = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic wants every product name in backticks. Rendering "GitLocus" as code
# in prose is worse documentation, not better.
doc_markdown = "allow"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
