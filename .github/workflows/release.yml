# SPDX-License-Identifier: Apache-2.0
#
# Release. A project whose subject is verifiable provenance cannot ship
# unattested binaries — it would refute itself in the most literal way.
#
# Every artifact gets a signed SLSA build provenance attestation via Sigstore.
# Verify a download with:
#
#   gh attestation verify <file> --repo hey-vera/gitlocus
#
# On immutability, precisely: the "release tags" ruleset blocks deletion and
# update of v* tags, so a published tag cannot be moved. GitHub's immutable
# releases feature — which also freezes the assets — is a repository setting
# that is not exposed on the API surface this project scripts against, so it
# must be enabled in repository settings. Until it is, assets are protected by
# the attestation rather than by the platform: a swapped file fails
# verification, which is detection rather than prevention.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true
        type: string

permissions:
  contents: read  # Read-only by default; the publish job elevates for itself.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Windows runners default to PowerShell, where "$TARGET" is not the env var
    # it looks like — it expands to nothing, and cargo reports "target was
    # empty". Set once for the job rather than per step, so a step added later
    # cannot reintroduce it.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Expansions are passed through env rather than interpolated into the
      # script body. None of these values is attacker-controlled today, but a
      # workflow that interpolates by habit will eventually interpolate a branch
      # name or an issue title, and that one is a shell injection.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p gitlocus-cli --target "$TARGET"

      # A tag is a promise about what the binary reports. v0.0.2 shipped binaries
      # that said 0.0.1, because the workspace version was never bumped and
      # nothing looked. This checks the artifact rather than the source, and it
      # runs natively on every target because each runner matches its own.
      - name: The binary reports the version being released
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          BIN="target/$TARGET/release/locus"
          [ -f "$BIN" ] || BIN="$BIN.exe"
          REPORTED=$("$BIN" --version)
          echo "tag $TAG, binary reports: $REPORTED"
          if [ "$REPORTED" != "locus ${TAG#v}" ]; then
            echo "::error::binary reports '$REPORTED' but is being released as $TAG"
            exit 1
          fi

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS_NAME" = "Windows" ]; then
            cp "target/$TARGET/release/locus.exe" "dist/locus-$TARGET.exe"
          else
            cp "target/$TARGET/release/locus" "dist/locus-$TARGET"
          fi
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A protected environment puts a human between a tag push and a signed
    # public artifact. Configure required reviewers on the `release`
    # environment in repository settings.
    environment: release
    permissions:
      contents: write     # Create the release and upload its assets.
      id-token: write     # Exchanged for a short-lived Sigstore certificate.
      attestations: write # Record build provenance against the repository.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: staging
          merge-multiple: true

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/locus-*

      # Provenance says who built these binaries and from what revision. It says
      # nothing about what is inside them, and Cargo.lock names 134 packages.
      # The bill of materials is the other half of that question.
      - name: Generate the bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: locus.spdx.json
          output-file: dist/locus.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Attested by the same workflow identity as the provenance above, so a
      # reader can establish that this document came from this release rather
      # than from a file someone attached. An unattested SBOM is a claim about a
      # supply chain made by an unauthenticated party, which is the thing this
      # project exists to refuse.
      - name: Attest the bill of materials
        id: attest-sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/locus-*
          sbom-path: dist/locus.spdx.json

      # Without the bundle attached, verifying a download means asking GitHub's
      # attestation API about an artifact GitHub also hosts — which is a weaker
      # property than it looks, and unavailable on a network that cannot reach
      # it. Shipping the bundle makes verification offline and independent.
      - name: Attach the attestation bundles
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [ ! -s "$BUNDLE" ]; then
            echo "::error::the attest step produced no bundle at $BUNDLE"
            exit 1
          fi
          cp "$BUNDLE" dist/locus.intoto.jsonl
          if [ ! -s "$SBOM_BUNDLE" ]; then
            echo "::error::the SBOM attest step produced no bundle at $SBOM_BUNDLE"
            exit 1
          fi
          cp "$SBOM_BUNDLE" dist/locus.sbom.intoto.jsonl
          # SHA256SUMS was written before the bundles existed. Rewrite it over
          # exactly what is about to be published, naming the files rather than
          # globbing, so the checksum file can never cover itself.
          cd dist
          sha256sum locus-* locus.intoto.jsonl locus.spdx.json locus.sbom.intoto.jsonl > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
          {
            echo "Verify a download against the attestation API:"
            echo '```'
            echo "gh attestation verify locus-<target> --repo $REPO"
            echo '```'
            echo "Or offline, against the bundle published with the release:"
            echo '```'
            echo "gh attestation verify locus-<target> --bundle locus.intoto.jsonl --repo $REPO"
            echo '```'
            echo "The bill of materials is locus.spdx.json, attested separately:"
            echo '```'
            echo "gh attestation verify locus-<target> --bundle locus.sbom.intoto.jsonl --repo $REPO --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishing to crates.io with an API token means a long-lived credential that
  # can publish any version of any crate this account owns, stored in repository
  # secrets, valid until someone remembers to rotate it. For a project whose
  # thesis is verified identity over asserted credentials, that would be an
  # awkward thing to have in the one workflow that produces public artefacts.
  #
  # Trusted Publishing removes it. The workflow proves its own identity over
  # OIDC — the same mechanism `attest-build-provenance` above already uses — and
  # crates.io issues a token valid for thirty minutes, scoped to this crate, and
  # revoked when the job ends. There is no secret to leak and none to rotate.
  #
  # ONE-TIME BOOTSTRAP, and it cannot be done from here: Trusted Publishing can
  # only be configured on a crate that already exists and is owned. So the very
  # first `cargo publish` of each crate is manual, with a token, from a
  # maintainer's machine. After that, add this repository, `release.yml` and the
  # `release` environment under Trusted Publishing in each crate's crates.io
  # settings, and enable "require Trusted Publishing" to disable token publishing
  # for good. Until that is done this job is inert and says so rather than
  # failing the release.
  publish-crates:
    name: publish-crates
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same protected environment as the release itself. Publishing to
    # crates.io cannot be undone — a yank hides a version, it does not remove it
    # — so a human approves it, exactly as they approve the release.
    environment: release
    permissions:
      contents: read
      id-token: write  # Exchanged for a short-lived, crate-scoped crates.io token.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Authenticate with crates.io
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish, in dependency order
        env:
          # Empty when the auth step failed, which is what happens before the
          # one-time bootstrap has been done.
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::notice::Trusted Publishing is not configured yet, so nothing was published."
            echo "The release itself succeeded. See the comment above this job for the one-time setup."
            exit 0
          fi

          version="${VERSION#v}"
          # crates.io refuses requests without one, with a 403 that reads like a
          # permissions problem and is not.
          ua="gitlocus-release (https://github.com/hey-vera/gitlocus)"

          # Whether a version is on the registry, asked of the registry.
          #
          # `cargo info <crate>@<version>` looks like the obvious check and is
          # wrong here: run inside this workspace it resolves to the local path
          # dependency and reports the crate as present when it has never been
          # published. `cargo search` is also wrong — it returns only the latest
          # version, so re-running an older tag would try to republish it.
          on_registry() {
            local code
            code=$(curl -sS -A "$ua" -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/$1/$2")
            [ "$code" = "200" ]
          }

          # gitlocus-cli depends on gitlocus-core by version, so core must be on
          # the index before cli can resolve it.
          for crate in gitlocus-core gitlocus-cli; do
            if on_registry "$crate" "$version"; then
              echo "$crate $version is already published; nothing to do"
              continue
            fi

            echo "publishing $crate $version"
            # Publishing is not idempotent, and a re-run of a release that got
            # halfway is a situation worth surviving. The race between the check
            # above and this call is small but real, so the error is tolerated
            # rather than only pre-empted.
            if ! cargo publish -p "$crate" --locked 2> publish.err; then
              cat publish.err
              if grep -qiE 'already (been )?uploaded|already exists' publish.err; then
                echo "$crate $version was published by something else in the meantime"
              else
                exit 1
              fi
            fi

            # crates.io is eventually consistent: the index lags the upload, and
            # cli resolving core is the one place that matters.
            for _ in $(seq 1 30); do
              if on_registry "$crate" "$version"; then
                echo "$crate $version is on the registry"
                break
              fi
              sleep 10
            done
            if ! on_registry "$crate" "$version"; then
              echo "::error::$crate $version did not appear on the registry within five minutes"
              exit 1
            fi
          done

          echo "published $version" >> "$GITHUB_STEP_SUMMARY"
