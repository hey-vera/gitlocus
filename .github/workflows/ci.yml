# SPDX-License-Identifier: Apache-2.0
#
# Deterministic checks. Everything here is reproducible by anyone with the same
# inputs, which is what makes it eligible to block a merge under this project's
# own model. Assessed checks (model review) do not live in this file and must
# never be added to it — see docs/adr/0003-evidence-classes.md.
#
# Job names are load-bearing: they are the requirement names in
# .gitlocus/policy.yml. Renaming a job here without renaming the requirement
# there breaks the gate, and the gate job will say so.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merges performed by auto-merge use GITHUB_TOKEN, and pushes made with that
  # token do not trigger workflows. main therefore gets no run of its own on
  # merge; a daily run keeps its health from being purely inferred.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read  # Read-only by default; no job here needs more.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --all-targets --locked

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Includes the conformance suite, which validates this crate's own
      # serialisation against the published schemas in spec/schemas.
      - run: cargo test --all-targets --locked
      # --all-targets skips doctests; the model's documentation carries examples
      # worth keeping honest.
      - run: cargo test --doc --locked

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Every schema must itself be a valid JSON Schema, and must be
      # self-contained: a remote $ref would make every consumer's validation
      # depend on a live domain.
      - name: Schemas are valid and self-contained
        run: python3 scripts/check_schemas.py

      - name: This repository's own policy compiles
        run: cargo run --locked -p gitlocus-cli -- policy check --policy .gitlocus/policy.yml

  # The gate: this project evaluated by this project. A policy engine whose
  # authors exempt themselves demonstrates nothing.
  #
  # Evidence is collected from the forge's own check runs rather than inferred
  # from this job's needs list. That matters for correctness: the ci-and-policy
  # rule requires a workflow-audit check that lives in a different workflow, and
  # a gate that could only observe its own workflow would report a verdict on
  # part of the evidence while presenting it as the whole.
  #
  # CI gates the machine-checkable half only, so a verdict of needs_human is a
  # success here. Be precise about what that means today: this repository has one
  # maintainer, required approvals in the branch ruleset are therefore zero, and
  # nothing satisfies the policy's own `approvals: 1`. The gate reports
  # needs_human on every pull request here and that outstanding attestation is
  # currently enforced by nobody. It closes with a signed approval under
  # approvals_signed_by once the signing producer lands (#8), not before.
  gate:
    name: gate
    if: github.event_name == 'pull_request'
    needs: [build, tests, lint, fmt, schema-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # Read the revision being evaluated.
      checks: read    # Collect check-run outcomes as deterministic evidence.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the gate
        run: cargo build --release --locked -p gitlocus-cli

      - name: Describe the contribution
        env:
          # Passed through env rather than interpolated: a branch name or a login
          # is attacker-controlled text and must never reach a script body.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          # How many merged pull requests earn the contributor tier (ADR 0009).
          CONTRIBUTOR_AFTER: "1"
        run: |
          set -euo pipefail

          # The repository permission is authoritative and does not depend on
          # profile visibility. author_association reports only *publicly
          # visible* association, so a maintainer with private org membership
          # arrives as CONTRIBUTOR — it fails in the safe direction, which is
          # exactly why it is easy to miss. A fork's read-only token cannot read
          # the permission, so the association remains the fallback and the
          # source is logged either way.
          PERMISSION=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" \
            --jq '.permission' 2>/dev/null || true)

          case "$PERMISSION" in
            admin|maintain) TIER=maintainer; SOURCE="repository permission $PERMISSION" ;;
            write)          TIER=contributor; SOURCE="repository permission write" ;;
            read|none)      TIER=unknown; SOURCE="repository permission $PERMISSION" ;;
            *)
              SOURCE="public association $ASSOCIATION (permission unreadable)"
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) TIER=maintainer ;;
                CONTRIBUTOR)               TIER=contributor ;;
                *)                         TIER=unknown ;;
              esac
              ;;
          esac

          # Promotion from merged history, per ADR 0009. Attribution comes from
          # the forge, which authenticated the account, and never from the git
          # author field — that is free text anyone can set to anything, so
          # trust derived from it is trust anyone can mint.
          #
          # Nothing is stored: the count is recomputed here every run, so
          # standing stays a fact about work done rather than a score to farm.
          if [ "$TIER" = "unknown" ]; then
            MERGED=$(gh api -X GET search/issues               -f q="repo:$REPO is:pr is:merged author:$AUTHOR"               --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${MERGED:-0}" -ge "$CONTRIBUTOR_AFTER" ]; then
              TIER=contributor
              SOURCE="$MERGED merged pull request(s)"
            fi
          fi

          echo "actor $AUTHOR at tier $TIER, from $SOURCE"

          # A VOUCHED.td can raise an unknown actor to vouched, and a
          # denouncement caps the tier regardless of what was derived above.
          VOUCH_ARGS=""
          if [ -f VOUCHED.td ]; then
            VOUCH_ARGS="--vouched-file VOUCHED.td --platform github"
            echo "consulting VOUCHED.td"
          fi

          # Built by the shipped command rather than by a script that only exists
          # here: anything this repository needs in order to adopt GitLocus, an
          # outside repository needs too.
          ./target/release/locus contribution \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --repository "github.com/$REPO" \
            --actor "$AUTHOR" \
            --tier "$TIER" \
            --key-binding "https://token.actions.githubusercontent.com" \
            $VOUCH_ARGS \
            > contribution.json
          cat contribution.json

      - name: Collect evidence from check runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate --jq '.check_runs' > raw.json
            python3 scripts/flatten_checks.py
            if python3 scripts/collect_evidence.py --pending-only; then
              break
            fi
            echo "waiting for checks to finish (attempt $attempt)"
            sleep 15
          done
          python3 scripts/collect_evidence.py

      - name: Evaluate
        run: |
          set -uo pipefail
          LOCUS=./target/release/locus
          ARGS="--policy .gitlocus/policy.yml --contribution contribution.json --evidence evidence.json"

          # A non-zero exit here is the CLI correctly reporting "not mergeable
          # yet", which is not a CI failure. The decision below is what decides.
          "$LOCUS" verify $ARGS | tee verdict.txt || true
          "$LOCUS" verify $ARGS --format json > verdict.json || true

          DECISION=$(python3 -c "import json;print(json.load(open('verdict.json'))['decision'])")
          python3 scripts/render_summary.py "$DECISION" >> "$GITHUB_STEP_SUMMARY"

          if [ "$DECISION" = "blocked" ]; then
            echo "::error::gate blocked this contribution"
            exit 1
          fi
          echo "gate decision: $DECISION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gitlocus-verdict
          path: |
            contribution.json
            evidence.json
            verdict.json
          retention-days: 14
