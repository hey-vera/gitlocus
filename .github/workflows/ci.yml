# SPDX-License-Identifier: Apache-2.0
#
# Deterministic checks. Everything here is reproducible by anyone with the same
# inputs, which is what makes it eligible to block a merge under this project's
# own model. Assessed checks (model review) do not live in this file and must
# never be added to it — see docs/adr/0003-evidence-classes.md.
#
# Job names are load-bearing: they are the requirement names in
# .gitlocus/policy.yml. Renaming a job here without renaming the requirement
# there breaks the gate, and the gate job will say so.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merges performed by auto-merge use GITHUB_TOKEN, and pushes made with that
  # token do not trigger workflows. main therefore gets no run of its own on
  # merge; a daily run keeps its health from being purely inferred.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read  # Read-only by default; no job here needs more.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      - run: just build

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      # The recipe runs the workspace tests, the doctests, and the tests for the
      # evidence collector. The collector decides what the gate is allowed to
      # believe, so its edge cases are security-relevant: two of the cases it
      # covers are bugs this project shipped — `skipped` counted as a pass, and
      # a check reporting a conclusion while still marked in progress counted as
      # inconclusive, which blocked a contribution every check agreed with.
      - run: just tests

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      - run: just lint

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      - run: just fmt

  # `rust-version` in the workspace manifest is a promise to anyone whose
  # toolchain is older than ours. It was declared and never compiled against,
  # which makes it an assertion rather than a fact.
  #
  # The version is read out of the manifest rather than written here twice. A
  # second copy would drift, and the drift would be silent in the direction that
  # matters: the manifest would claim support this job never checked.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      - run: just msrv

  # Three targets are released and, until now, one was tested. That gap already
  # cost a release: v0.0.1's Windows build broke because a step ran under
  # PowerShell, and nothing caught it until the tag was pushed and the tag
  # ruleset correctly refused to let it be moved.
  platform:
    name: platform (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    # Windows runners default to PowerShell, where "$VAR" expands to nothing.
    # Set once for the job so a step added later cannot reintroduce it.
    defaults:
      run:
        shell: bash
    strategy:
      # Every target's result is wanted, not just the first failure: knowing
      # that macOS also broke is the difference between one fix and two.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      # Each runner is native to its target, so the tests actually execute
      # rather than merely linking.
      - run: just platforms

  # A matrix produces one check per leg, and a requirement name has to be
  # stable — .gitlocus/policy.yml names checks, and "platform (aarch64-apple-
  # darwin)" is not a name a policy should have to know. This collapses the
  # matrix into one.
  platforms:
    name: platforms
    needs: [platform]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shipped target built and tested
        env:
          RESULT: ${{ needs.platform.result }}
        run: |
          set -euo pipefail
          echo "matrix result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::a target this project ships did not pass"
            exit 1
          fi

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      # The recipe asserts that every schema is a valid JSON Schema and is
      # self-contained — a remote $ref would make every consumer's validation
      # depend on a live domain — and then compiles this repository's own policy.
      - run: just schema-validation

  # Do the tests actually constrain the implementation, or do they merely run it?
  #
  # A green `tests` check is worth exactly what the tests are worth, and weakening
  # a test is usually cheaper than fixing the code — the failure ADR 0006 names.
  # Coverage cannot see it: loosening an assertion executes the same lines. A
  # mutant that survives can, because it means nothing asserted the behaviour the
  # mutant changed. See docs/adr/0015-mutation-testing-is-what-resists-gate-gaming.md.
  #
  # Scoped to the diff, so cost tracks the size of the change rather than the
  # size of the codebase.
  mutants:
    name: mutants
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-mutants@27.1.0

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      - name: Mutants in the changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: just mutants "$BASE_SHA"

  # The gate: this project evaluated by this project. A policy engine whose
  # authors exempt themselves demonstrates nothing.
  #
  # Evidence is collected from the forge's own check runs rather than inferred
  # from this job's needs list. That matters for correctness: the ci-and-policy
  # rule requires a workflow-audit check that lives in a different workflow, and
  # a gate that could only observe its own workflow would report a verdict on
  # part of the evidence while presenting it as the whole.
  #
  # CI gates the machine-checkable half only, so a verdict of needs_human is a
  # success here. Be precise about what that means today: this repository has one
  # maintainer, required approvals in the branch ruleset are therefore zero, and
  # nothing satisfies the policy's own `approvals: 1`. The gate reports
  # needs_human on every pull request here and that outstanding attestation is
  # currently enforced by nobody. It closes with a signed approval under
  # approvals_signed_by once the signing producer lands (#8), not before.
  gate:
    name: gate
    if: github.event_name == 'pull_request'
    needs: [build, tests, lint, fmt, schema-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # Read the revision being evaluated.
      checks: read    # Collect check-run outcomes as deterministic evidence.
      actions: read   # Resolve this job's own check-run id, to exclude itself (#81).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the gate from the base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Build into the cached workspace target directory rather than the
          # worktree's own, or rust-cache never sees these artifacts and every
          # pull request pays for a cold release build.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          # The gate must not be compiled from the contribution it judges. A
          # change to crates/gitlocus-core/src/policy.rs changes the evaluator
          # that then decides whether that change may merge — ADR 0006's
          # principle one level down, and a more direct lever than any path the
          # policy protects.
          #
          # The cost is real and is stated in ADR 0014: the base binary does not
          # know flags a pull request invents, so a change to this CLI needs two
          # pull requests, one adding the flag and one using it.
          git worktree add --detach ../gate-base "$BASE_SHA"
          cargo build --release --locked -p gitlocus-cli \
            --manifest-path ../gate-base/Cargo.toml
          cp "$CARGO_TARGET_DIR/release/locus" ./locus-gate
          echo "gate built from $BASE_SHA: $(./locus-gate --version)"

      - name: Describe the contribution
        env:
          # Passed through env rather than interpolated: a branch name or a login
          # is attacker-controlled text and must never reach a script body.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          # How many merged pull requests earn the contributor tier (ADR 0009).
          CONTRIBUTOR_AFTER: "1"
        run: |
          set -euo pipefail

          # The repository permission is authoritative and does not depend on
          # profile visibility. author_association reports only *publicly
          # visible* association, so a maintainer with private org membership
          # arrives as CONTRIBUTOR — it fails in the safe direction, which is
          # exactly why it is easy to miss. A fork's read-only token cannot read
          # the permission, so the association remains the fallback and the
          # source is logged either way.
          PERMISSION=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" \
            --jq '.permission' 2>/dev/null || true)

          case "$PERMISSION" in
            admin|maintain) TIER=maintainer; SOURCE="repository permission $PERMISSION" ;;
            write)          TIER=contributor; SOURCE="repository permission write" ;;
            read|none)      TIER=unknown; SOURCE="repository permission $PERMISSION" ;;
            *)
              SOURCE="public association $ASSOCIATION (permission unreadable)"
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) TIER=maintainer ;;
                CONTRIBUTOR)               TIER=contributor ;;
                *)                         TIER=unknown ;;
              esac
              ;;
          esac

          # Promotion from merged history, per ADR 0009. Attribution comes from
          # the forge, which authenticated the account, and never from the git
          # author field — that is free text anyone can set to anything, so
          # trust derived from it is trust anyone can mint.
          #
          # Nothing is stored: the count is recomputed here every run, so
          # standing stays a fact about work done rather than a score to farm.
          if [ "$TIER" = "unknown" ]; then
            MERGED=$(gh api -X GET search/issues               -f q="repo:$REPO is:pr is:merged author:$AUTHOR"               --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${MERGED:-0}" -ge "$CONTRIBUTOR_AFTER" ]; then
              TIER=contributor
              SOURCE="$MERGED merged pull request(s)"
            fi
          fi

          echo "actor $AUTHOR at tier $TIER, from $SOURCE"

          # A VOUCHED.td can raise an unknown actor to vouched, and a
          # denouncement caps the tier regardless of what was derived above.
          VOUCH_ARGS=""
          if [ -f VOUCHED.td ]; then
            VOUCH_ARGS="--vouched-file VOUCHED.td --platform github"
            echo "consulting VOUCHED.td"
          fi

          # Built by the shipped command rather than by a script that only exists
          # here: anything this repository needs in order to adopt GitLocus, an
          # outside repository needs too.
          ./locus-gate contribution \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --repository "github.com/$REPO" \
            --actor "$AUTHOR" \
            --tier "$TIER" \
            --key-binding "https://token.actions.githubusercontent.com" \
            $VOUCH_ARGS \
            > contribution.json
          cat contribution.json

      - name: Collect evidence from check runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Excluded by identity as the action does it (#81); the name pattern
          # in collect_evidence.py still covers this repository's posture jobs.
          GITLOCUS_SELF_CHECK_RUN=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq --arg runner "$RUNNER_NAME" \
            '.jobs[] | select(.status == "in_progress" and .runner_name == env.RUNNER_NAME) | .id' \
            2>/dev/null | head -n1 || true)
          export GITLOCUS_SELF_CHECK_RUN
          echo "this job is check run ${GITLOCUS_SELF_CHECK_RUN:-<unresolved>}"
          for attempt in $(seq 1 20); do
            gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate --jq '.check_runs' > raw.json
            python3 scripts/flatten_checks.py
            if python3 scripts/collect_evidence.py --pending-only; then
              break
            fi
            echo "waiting for checks to finish (attempt $attempt)"
            sleep 15
          done
          python3 scripts/collect_evidence.py

      - name: Read the policy that governs this contribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A contribution is governed by the policy in force when it was
          # proposed, not only by the one it ships. Without this, a pull request
          # that deletes a rule is judged by a document that no longer contains
          # it: honest evaluation of a file the contributor wrote, reaching a
          # conclusion this repository never agreed to.
          #
          # Absence is legitimate — the change that first adds a policy has none
          # to be governed by — and is kept apart from a read failure, which
          # set -e turns into a blocked gate rather than a silent fallback.
          if git cat-file -e "$BASE_SHA:.gitlocus/policy.yml" 2>/dev/null; then
            git show "$BASE_SHA:.gitlocus/policy.yml" > base-policy.yml
            echo "governed also by the policy at $BASE_SHA"
          else
            echo "no policy at $BASE_SHA; this contribution introduces one"
          fi

      - name: Evaluate
        run: |
          set -uo pipefail
          LOCUS=./locus-gate
          ARGS="--policy .gitlocus/policy.yml --contribution contribution.json --evidence evidence.json"
          if [ -f base-policy.yml ]; then
            ARGS="$ARGS --governing-policy base-policy.yml"
          fi

          # A non-zero exit here is the CLI correctly reporting "not mergeable
          # yet", which is not a CI failure. The decision below is what decides.
          "$LOCUS" verify $ARGS | tee verdict.txt || true
          "$LOCUS" verify $ARGS --format json > verdict.json || true

          DECISION=$(python3 -c "import json;print(json.load(open('verdict.json'))['decision'])")
          python3 scripts/render_summary.py "$DECISION" >> "$GITHUB_STEP_SUMMARY"

          if [ "$DECISION" = "blocked" ]; then
            echo "::error::gate blocked this contribution"
            exit 1
          fi
          echo "gate decision: $DECISION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gitlocus-verdict
          path: |
            contribution.json
            evidence.json
            base-policy.yml
            verdict.json
          retention-days: 14
