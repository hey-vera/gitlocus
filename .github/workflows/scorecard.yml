# SPDX-License-Identifier: Apache-2.0
#
# OpenSSF Scorecard. Publishing the score is the point: a project asking others
# to trust its verdicts should be legible about its own posture, including where
# that posture is weak.
#
# The results are also published to the OpenSSF REST API so the badge in the
# README reflects reality rather than an assertion.

name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "26 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read  # Read-only by default; the analysis job elevates for itself.

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write  # Upload the SARIF results to the security tab.
      id-token: write         # Sign published results so the badge is verifiable.
      contents: read          # Read the repository being scored.
      actions: read           # Scorecard inspects workflows and run history.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: results.sarif
