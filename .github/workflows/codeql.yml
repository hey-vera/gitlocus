# SPDX-License-Identifier: Apache-2.0
#
# CodeQL. The `actions` language matters at least as much as `rust` here: this
# repository's workflows contain real logic, and a flaw in the gate's own
# workflow would be worth more to an attacker than a flaw in the library.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Read the source being analysed.
      contents: read
      # Upload CodeQL results to the security tab.
      security-events: write
      # Read workflow run metadata, which the actions analysis needs.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          # security-extended adds lower-severity queries. For a project whose
          # product is other people's trust, the extra noise is worth reading.
          queries: security-extended

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:${{ matrix.language }}
