# SPDX-License-Identifier: Apache-2.0
#
# Supply-chain checks. These matter more than usual here: a compromised action
# in this repository could make every other check report green, which would make
# the whole project a liability rather than a safeguard.

name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories land continuously, so a clean run last week means little.
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named to match the workflow-audit requirement in .gitlocus/policy.yml.
  workflow-audit:
    name: workflow-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Read the workflows being audited.
      contents: read
      # zizmor uploads its findings as SARIF.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor audits workflows for injection, over-broad permissions, unpinned
      # actions and credential persistence.
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          persona: pedantic

      # zizmor covers a great deal but does not assert the two rules this
      # project treats as absolute, so they are checked directly.
      - name: Structural rules
        run: |
          set -euo pipefail
          fail=0

          # The pull-request-target trigger runs with a writable token in the
          # context of the base repository. In a repository whose whole purpose
          # is evaluating untrusted contributions, it is banned outright.
          #
          # Matched as a YAML key at the start of a line, so that this check does
          # not trip over its own error message.
          if grep -rnE '^[[:space:]]*(-[[:space:]]*)?pull_request_target[[:space:]]*:' .github/workflows/; then
            echo "::error::the pull-request-target trigger is banned in this repository"
            fail=1
          fi

          # Every action reference must be a full 40-character commit SHA. A tag
          # is mutable and a mutable dependency in CI is a supply-chain hole.
          while IFS= read -r line; do
            ref="${line##*@}"
            if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::unpinned action reference: $line"
              fail=1
            fi
          done < <(grep -rhoE '^\s*-?\s*uses:\s*\S+' .github/workflows/ | sed -E 's/.*uses:\s*//')

          [ "$fail" -eq 0 ] && echo "workflow structure ok"
          exit "$fail"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The sign-off is this project's accountability mechanism: it is the
      # statement that a named human will answer for the change. Checking it is
      # not paperwork, it is the one thing the model actually requires.
      - name: Every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              subject=$(git show -s --format=%s "$sha")
              echo "::error::missing Signed-off-by on $sha: $subject"
              fail=1
            fi
          done < <(git rev-list "$BASE_SHA".."$HEAD_SHA")
          if [ "$fail" -ne 0 ]; then
            echo "Fix with: git commit --amend -s   (or: git rebase --signoff $BASE_SHA)"
            exit 1
          fi
          echo "all commits signed off"

  licence-headers:
    name: licence-headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every source file carries an SPDX identifier
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! head -5 "$f" | grep -q "SPDX-License-Identifier: Apache-2.0"; then
              echo "::error file=$f::missing SPDX-License-Identifier header"
              fail=1
            fi
          done < <(find crates -name '*.rs' -type f)
          [ "$fail" -eq 0 ] && echo "all source files carry SPDX headers"
          exit "$fail"
