# SPDX-License-Identifier: Apache-2.0
#
# Supply-chain checks. These matter more than usual here: a compromised action
# in this repository could make every other check report green, which would make
# the whole project a liability rather than a safeguard.

name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories land continuously, so a clean run last week means little.
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read  # Read-only by default; the audit job elevates for itself.

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named to match the workflow-audit requirement in .gitlocus/policy.yml.
  workflow-audit:
    name: workflow-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read          # Read the workflows being audited.
      security-events: write  # zizmor uploads its findings as SARIF.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor audits workflows for injection, over-broad permissions, unpinned
      # actions and credential persistence.
      #
      # The pedantic persona stays on: it is what caught the template-injection
      # findings this repository shipped with initially. The failure threshold is
      # set at `low` so that purely informational findings are printed and read
      # but do not block. Exactly one informational finding is outstanding, and
      # it is a considered disagreement rather than an oversight:
      #
      #   superfluous-actions — suggests replacing dtolnay/rust-toolchain with
      #   rustup in a script step. Declined: the action pins the toolchain and
      #   selects components and cross-compilation targets declaratively, and
      #   the runner's preinstalled Rust drifts without notice.
      #
      # Anything at low or above fails the build. Currently there are none.
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          persona: pedantic
          min-severity: low

      # zizmor covers a great deal but does not assert the two rules this
      # project treats as absolute, so they are checked directly.
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      # The two rules this project treats as absolute, which zizmor does not
      # assert: the pull-request-target ban, and full-SHA action pinning.
      - run: just structural-rules

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-deny
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      - run: just cargo-deny

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The sign-off is this project's accountability mechanism: it is the
      # statement that a named human will answer for the change. Checking it is
      # not paperwork, it is the one thing the model actually requires.
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      # The sign-off is this project's accountability mechanism: it is the
      # statement that a named human will answer for the change. Checking it is
      # not paperwork, it is the one thing the model actually requires.
      - name: Every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: just dco "$BASE_SHA" "$HEAD_SHA"

  licence-headers:
    name: licence-headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The licence map is executable rather than documentary. This repository
      # is Apache-2.0 except for the server, which is AGPL-3.0 (ADR 0016), and a
      # file carrying the wrong identifier fails here instead of being noticed
      # in review, or not.
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just
      # The licence map is executable rather than documentary. This repository
      # is Apache-2.0 except for the server, which is AGPL-3.0 (ADR 0016), and a
      # file carrying the wrong identifier fails here instead of being noticed
      # in review, or not.
      - run: just licence-headers
